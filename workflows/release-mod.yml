# Veröffentlicht ein GitHub Release NUR auf ausdrücklichen manuellen Start mit Bestätigung.
# Es gibt keinen automatischen Release bei Push, Merge oder Tag.
name: Release der Mod (manuell)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. mod-v0.1.0'
        required: true
      confirm:
        description: 'Zur Bestätigung das Wort "release" eintippen'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm == 'release' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - run: gradle build --no-daemon
      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            mod-v[0-9]*) ;;
            *) echo "Ungültiger Tag (erwartet mod-v<Version>)"; exit 1 ;;
          esac
          jar="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)"
          gh release create "$TAG" "$jar" --repo "$GITHUB_REPOSITORY" \
            --title "SMPEvents-Mod $TAG" \
            --notes "Fabric-Client-Mod für Minecraft 1.21.11. Installation und Einrichtung: minecraft-mod/README.md"
